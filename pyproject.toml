[project]
name = "off-taxonomy-coverage"
version = "0.1.0"
description = "Open Food Facts taxonomy coverage by country and language"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "requests>=2.31",
    "plotly>=5.20",
    "pycountry>=23",
    "babel>=2.14",
    "jupyter",
    "nbformat",
    "ipykernel",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
